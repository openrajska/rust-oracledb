# CI of the openrajska fork (see RAJSKA.md): the crate's own test suite
# against Oracle AI Database 26ai Free, on every fork branch and pull request.
name: rajska-ci

on:
  push:
    branches: ["rajska/**", "patch/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Same toolchain as php-oracle's ddev (.ddev/web-build/Dockerfile.rust).
  RUST_TOOLCHAIN: "1.100.0"

jobs:
  test:
    name: cargo test (26ai Free)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      oracle:
        # Same image as php-oracle's ddev (.ddev/docker-compose.oracle.yaml).
        image: gvenzl/oracle-free:23.26.3-faststart
        env:
          ORACLE_PASSWORD: oracle
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-start-period 30s
          --health-retries 30
    env:
      # One test at a time: the parallel default opens and closes Sessions fast
      # enough that the 26ai Free listener refuses some with ORA-12516.
      RUST_TEST_THREADS: "1"
      RSO_TEST_CONNECT_STRING: localhost:1521/FREEPDB1
      RSO_TEST_ADMIN_USER: sys
      RSO_TEST_ADMIN_PASSWORD: oracle
      RSO_TEST_MAIN_PASSWORD: rsotest
      RSO_TEST_PROXY_PASSWORD: rsotestproxy
      RSO_TEST_DIRECTORY_NAME: RSO_TEST_DIR
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check the pin
        run: |
          tag="$(tr -d '[:space:]' < .rajska/upstream-tag)"
          git merge-base --is-ancestor "$tag" HEAD \
            || { echo "::error::$tag is not an ancestor of HEAD"; exit 1; }
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          [ "v$version" = "$tag" ] \
            || { echo "::error::Cargo.toml says $version but the pin is $tag"; exit 1; }
          echo "pinned to $tag ($(git rev-parse "$tag^{commit}"))"

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --all-features --all-targets

      - name: Create the DIRECTORY for the BFILE tests
        run: |
          docker exec "${{ job.services.oracle.id }}" bash -c \
            "echo \"create or replace directory $RSO_TEST_DIRECTORY_NAME as '/tmp';\" \
             | sqlplus -s -L sys/oracle@//localhost/FREEPDB1 as sysdba"

      - name: Create the test schema
        run: cargo run --locked --bin create_test_schema

      - name: Test
        run: cargo test --locked --all-features
